services:
  - type: web
    name: gift-bid-trend-analyzer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free # Can be updated to paid plans if needed
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false # User will input their database connection string in the Render UI
      - key: PYTHON_VERSION
        value: 3.10.0
