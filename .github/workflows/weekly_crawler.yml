name: Weekly Gift Bid Crawler

on:
  schedule:
    # Runs at 00:00 UTC (09:00 KST) every Monday
    - cron: '0 0 * * 1'
  workflow_dispatch:
    # Allows manual trigger of the crawler via GitHub UI

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Crawler Batch
      env:
        # We fetch the target PostgreSQL database URL from GitHub repository secrets
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        python run_crawler.py
